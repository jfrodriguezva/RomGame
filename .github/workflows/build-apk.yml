name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "game-core/**"
      - "gradle/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Test rules and Android integration
        run: |
          chmod +x gradlew
          ./gradlew :game-core:test :app:testDebugUnitTest lintDebug assembleDebug bundleRelease --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: romina-game-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: romina-game-aab
          path: app/build/outputs/bundle/release/app-release.aab
