<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RominaGame</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #1d1a17; color: #f1e9de; font: 15px/1.45 system-ui, sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .aviso { max-width: 560px; margin: 15vh auto; padding: 0 16px; }
  code { background: #3a342d; padding: 1px 5px; border-radius: 5px; }
  a { color: #e0a96a; }
</style>
</head>
<body>
<!-- La app real de Android (el mismo APK de main) en un emulador de Appetize.io. -->
<script src="config.js"></script>
<script>
  const clave = (window.ROMINA || {}).appetizeKey;
  if (clave) {
    const f = document.createElement("iframe");
    f.src = "https://appetize.io/embed/" + encodeURIComponent(clave) + "?orientation=landscape&scale=auto";
    f.title = "RominaGame";
    f.allow = "autoplay; clipboard-write";
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="aviso"><h1>RominaGame</h1>' +
      '<p>El emulador todavía no está conectado. Falta guardar el token de ' +
      '<a href="https://appetize.io">Appetize.io</a> como secreto del repositorio ' +
      '(<code>gh secret set APPETIZE_API_TOKEN</code>) y volver a publicar.</p></div>';
  }
</script>
</body>
</html>
